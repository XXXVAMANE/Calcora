[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[context.production.environment]
  PUBLIC_SITE_URL = "https://numvori.com"

# Preserve paths when migrating the old host; preview domains are unaffected.
[[redirects]]
  from = "https://calcora-ai.netlify.app/*"
  to = "https://numvori.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://calcora-ai.netlify.app/*"
  to = "https://numvori.com/:splat"
  status = 301
  force = true
